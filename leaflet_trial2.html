<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.52.2/codemirror.min.css" />
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.61.0/theme/monokai.min.css" />

        <script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.52.2/codemirror.min.js"></script>
        <script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.52.2/mode/python/python.min.js"></script>
        <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>

        <style>
            html, body{
                height: 100%;
                width: 100%;
            }
            #map {
                width: 100%;
                height: 90%;
            }
            .container {
                width: 100%;
                height: 10%;
                border: 1;
                border-color: black;
            }
            .button {
                border-radius: 7px;
                border: 0;
                color: royalblue;
            }
        </style>
        <title>Trial</title>
    </head>
    <body>
        <div id="map"></div>
        <div class="container">
         <button class="button" id="btn">Run</button> 
         <div id="codeeditor"></div> 
        </div>
        <script>
            var myCodeMirror = CodeMirror(document.getElementById('codeeditor'), {
                                        lineNumbers: true,
                                        tabSize: 2,
                                        value: 'print("Hello, World")',
                                        mode: 'python',
                                        theme: 'monokai'
                                });
            var basemap = L.tileLayer('https://api.mapbox.com/styles/v1/{id}/tiles/{z}/{x}/{y}?access_token=pk.eyJ1Ijoibm92YWNvcnAyMDk5IiwiYSI6ImNrbmpyaGd1NjA0MGcycHBtM2t0Zmw3ZG8ifQ.ZywOp6WnweI53kJdjR7DlQ', {
                    attribution: 'Map data &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors, Imagery © <a href="https://www.mapbox.com/">Mapbox</a>',
                    maxZoom: 18,
                    id: 'mapbox/streets-v11',
                    tileSize: 512,
                    zoomOffset: -1,
                    accessToken: 'your.mapbox.access.token'
                });
            var map = L.map('map', {
                center: [27.573,94.555],
                zoom: 10,
                layers: [basemap]
                });
            var baseMaps = {
                "Base": basemap
            };
            var wmsLayer;
            var lcontrol = L.control.layers(baseMaps).addTo(map);

            document.getElementById("btn").addEventListener("click", function(){
                setup = myCodeMirror.getValue();
                if(map.hasLayer(wmsLayer)){
                    map.removeLayer(wmsLayer);
                    lcontrol.removeLayer(wmsLayer)
                }
                wmsLayer = L.tileLayer.wms("http://127.0.0.1:8000/wms/", {
                    request_script: setup
                }).addTo(map);
                lcontrol.addOverlay(wmsLayer, "WMS");
            });
        </script>
    </body>
</html>
