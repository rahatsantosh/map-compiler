<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
        <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
        <style>
            html, body{
                height: 100%;
                width: 100%;
            }
            #map {
                width: 100%;
                height: 90%;
            }
            .container {
                width: 100%;
                height: 10%;
                border: 1;
                border-color: black;
            }
            .button {
                border-radius: 7px;
                border: 0;
                color: royalblue;
            }
        </style>
        <title>Trial</title>
    </head>
    <body>
        <div id="map"></div>
        <div class="container">
         <button class="button" id="btn">Run</button> 
         <div id="ip" class="editor" contenteditable="true">Enter text<br /><br /><br /><br /><br /><br /></div> 
        </div>
        <script>
            var basemap = L.tileLayer('https://api.mapbox.com/styles/v1/{id}/tiles/{z}/{x}/{y}?access_token=pk.eyJ1Ijoibm92YWNvcnAyMDk5IiwiYSI6ImNrbmpyaGd1NjA0MGcycHBtM2t0Zmw3ZG8ifQ.ZywOp6WnweI53kJdjR7DlQ', {
                    attribution: 'Map data &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors, Imagery © <a href="https://www.mapbox.com/">Mapbox</a>',
                    maxZoom: 18,
                    id: 'mapbox/streets-v11',
                    tileSize: 512,
                    zoomOffset: -1,
                    accessToken: 'your.mapbox.access.token'
                });
            var map = L.map('map', {
                center: [27.573,94.555],
                zoom: 10,
                layers: [basemap]
                });
            var baseMaps = {
                "Base": basemap
            };
            var wmsLayer;
            var lcontrol = L.control.layers(baseMaps).addTo(map);
            /*
            setup = {
                "input": ["B08","B02","B03"],
                "min_threshold": [0,0,0],
                "max_threshold": [1,1,1],
                "grayscale": True,
                "weight": [1,1,1]
            };*/

            function run(){
                text = document.getElementById('ip').innerText;
                // regexp = /setup\s?=\s?(\{(.|\n)*\});/i
                // setup = regexp.exec(text);
                // setup = JSON.parse(setup[1]);
                setup = text
                return setup;
            }
            document.getElementById("btn").addEventListener("click", function(){
                setup = run();
                if(map.hasLayer(wmsLayer)){
                    map.removeLayer(wmsLayer);
                    lcontrol.removeLayer(wmsLayer)
                }
                // var wmsLayer = L.tileLayer.wms("http://127.0.0.1:8000/wms/", {
                //     input_band: setup['input'],
                //     min_threshold: setup['min_threshold'],
                //     max_threshold: setup['max_threshold'],
                //     weight: setup['weight']
                // }).addTo(map);
                wmsLayer = L.tileLayer.wms("http://127.0.0.1:8000/wms/", {
                    request_script: setup
                }).addTo(map);
                lcontrol.addOverlay(wmsLayer, "WMS");
            });
        </script>
    </body>
</html>
