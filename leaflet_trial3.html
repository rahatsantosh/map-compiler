<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.52.2/codemirror.min.css" />
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.61.0/theme/seti.min.css" />

        <script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.52.2/codemirror.min.js"></script>
        <script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.52.2/mode/python/python.min.js"></script>
        <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/chart.js@2.9.3/dist/Chart.min.js"></script>

        <style>
            html, body{
                height: 100%;
                width: 100%;
            }
            #map {
                width: 90%;
                height: 100%;
            }
            .container {
                width: 10%;
                height: 100%;
                border: 1;
                border-color: black;
            }
            .button {
                border-radius: 7px;
                border: 0;
                color: royalblue;
            }
        </style>
        <title>Trial</title>
    </head>
    <body>
        <h1>Map Compiler</h1>
        <div id="map" style="width: 75%; height: 75%; float:left"></div>
        <div class="container" style="width: 100%; height: 25%; float:left">
         <button class="button" id="btn">Run</button> 
         <div id="codeeditor" style="height: 100%"></div> 
        </div>
        <div class="container" style="width: 23%; height: 37%; display:inline-block;"> 
            <p id="console" style="height: 100%">>></p> 
        </div>
        <div class="container" style="width: 23%; height: 36%; display:inline-block;"> 
            <canvas id="graph" width="280" height="300"></canvas> 
        </div>
        <script>
            var myCodeMirror = CodeMirror(document.getElementById('codeeditor'), {
                                        lineNumbers: true,
                                        tabSize: 2,
                                        value: 'print("Hello, World")',
                                        mode: 'python',
                                        theme: 'seti'
                                });
            var basemap = L.tileLayer('https://api.mapbox.com/styles/v1/{id}/tiles/{z}/{x}/{y}?access_token=pk.eyJ1Ijoibm92YWNvcnAyMDk5IiwiYSI6ImNrbmpyaGd1NjA0MGcycHBtM2t0Zmw3ZG8ifQ.ZywOp6WnweI53kJdjR7DlQ', {
                    attribution: 'Map data &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors, Imagery © <a href="https://www.mapbox.com/">Mapbox</a>',
                    maxZoom: 18,
                    id: 'mapbox/streets-v11',
                    tileSize: 512,
                    zoomOffset: -1,
                    accessToken: 'your.mapbox.access.token'
                });
            var map = L.map('map', {
                center: [27.573,94.555],
                zoom: 10,
                layers: [basemap]
                });
            var baseMaps = {
                "Base": basemap
            };
            var wmsLayer;
            var lcontrol = L.control.layers(baseMaps).addTo(map);

            document.getElementById("btn").addEventListener("click", function(){
                let r = Date.now();
                setup = myCodeMirror.getValue();
                setup = setup.replaceAll(/#[^\n\r]*[\n]/g,"")

                is_console = setup.includes('print')
                is_tiled = (setup.includes('response') && setup.includes('setup('))
                is_graph = setup.includes('rasterPlot')
                console.log(is_graph);
                console.log(is_console);
                console.log(is_tiled);
                if (is_tiled)
                    wmsAdd(setup,r)
                if (is_console || is_graph)
                    console_request(setup,r)

                // if (check_print)
                // if(map.hasLayer(wmsLayer)){
                //     map.removeLayer(wmsLayer);
                //     lcontrol.removeLayer(wmsLayer)
                // }
                // //wmsLayer
                // //2 run functions
                // //state mgmt frontend
                // response = L.tileLayer.wms("http://127.0.0.1:8000/wms/", {
                //     request_script: setup,
                //     click_hash: r
                // });
                // console.log(response)
                // wmsLayer = response['wms'];
                // document.getElementById('console').innerHTML = response['console']
                // lcontrol.addOverlay(wmsLayer, "WMS");
            });

            function wmsAdd(setup,r){
                if(map.hasLayer(wmsLayer)){
                    map.removeLayer(wmsLayer);
                    lcontrol.removeLayer(wmsLayer)
                }
                wmsLayer = L.tileLayer.wms("http://127.0.0.1:8000/wms/", {
                    request_script: setup,
                    click_hash: r
                }).addTo(map);
                lcontrol.addOverlay(wmsLayer, "WMS");
            }

            function console_request(setup,r){
                let apiRequest = new XMLHttpRequest();
                apiRequest.responseType = 'json';
                url = "http://127.0.0.1:8000/std/?click_hash="+r+"&request_script="+encodeURI(setup)+"&";
                apiRequest.open("GET",url,true);
                console.log('A');
                apiRequest.onload  = function() {
                    var jsonResponse = apiRequest.response;
                    map_responses(jsonResponse);
                };
                console.log('B');
                apiRequest.send();
            }

            function map_responses(jsonResponse) {
                console.log(jsonResponse)
                if (jsonResponse.console){
                    //var console_response = jsonResponse.console.replaceAll('\n','\n>>>')
                    document.getElementById('console').innerHTML = jsonResponse.console;//console_response;
                }
                if (!jsonResponse.graph)
                    return;
                var mapResponse = jsonResponse.graph
                var ctx = document.getElementById('graph').getContext('2d');
                var chart = new Chart(ctx, mapResponse)
            }
        </script>
    </body>
</html>
